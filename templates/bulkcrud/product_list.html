<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Bulk Product Delete</title>
  </head>
  <body>
   <div class="container py-5">
       <div class="row">
           <div class="col">
               <h1>Product List
                <button class="btn btn-danger btn-sm" id="delete_btn"
                        style="float: right">Delete ALL</button>
               </h1>

                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">#</th>
                      <th scope="col">Name</th>
                      <th scope="col">Category</th>
                      <th scope="col">Price</th>
                      <th scope="col">Handle</th>
                    </tr>
                  </thead>
                  <tbody>
                  {% csrf_token %}
                  {% for product in products %}
                    <tr id="{{ product.pk }}">
                      <th scope="row">{{ product.pk }}</th>
                      <td>{{ product.name }}</td>
                      <td>{{ product.category }}</td>
                      <td>{{ product.price }}</td>
                      <td class="text-center">
                          <input id="product_checkbox" type="checkbox" name="product_id[]" value="{{ product.pk }}"/>
                      </td>
                    </tr>
                  {% endfor %}
                  </tbody>
                </table>
           </div>
       </div>
   </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

   <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

   <script>
        $(document).ready(function () {
            $("#delete_btn").click(function () {
                if(confirm("Are you sure want to delete this items?")) {
                    let csrf = $('input[name=csrfmiddlewaretoken').val();
                    var ids = $('#product_checkbox:checked').map(function() {
                            return this.value;
                        }
                    ).get().join(',');


                    // if length is zero
                    if(ids.length === 0) {
                        alert("Please select item to delete?");
                    } else {
                        console.log('ids', ids);
                        $.ajax({
                            url:".", // same url
                            method:"POST",
                            data:{
                                ids:ids,
                                csrfmiddlewaretoken:csrf
                            },
                            success: function (response) {
                                window.location.replace("/bulkcrud/list/");
                            }
                        });
                    }
                }
            });
        });
    </script>

  </body>
</html>
