{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Spinner{% endblock %}

{% block content %} 
<div class="container py-5">
    <div class="row">
        <div class="col-8 offset-2">
            <!-- spinner box -->
            <div class="text-center mt-3" id="spinner-box">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div class="text-center mt-2" id="data-box">

            </div>
        </div>
    </div> 
</div>
{% endblock %}

{% block stylesheet %}
<style>
    .not-visible {
        display: none;
    }

</style>
{% endblock %}

{% block scripts %}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script type="text/javascript">
    console.log('spinner js working')
    const spinnerBox = document.getElementById('spinner-box');
    const dataBox = document.getElementById('data-box');
   
    $.ajax({
        type: 'GET',
        url: '/post/json/',
        success: function(response) {
            setTimeout(() => {
                spinnerBox.classList.add('not-visible'); 
                for (const item of response) {
                    dataBox.innerHTML += `<h2>${item.title}</h2> <p>${item.body}</p><br/>`;
                }
            }, 500);
        },
        error: function(error) {
            setTimeout(() => {
                dataBox.innerHTML = '<h2>Failed to load the data.</h2>'
            }, 500);
        }
    });
</script>
{% endblock %}
