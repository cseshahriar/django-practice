{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Live Search{% endblock %}

{% block content %} 
<div class="container py-5">
    <div class="row">
        <div class="col-8 offset-2">
            <input id="search_here" type="text" class="form-control" placeholder="Type here to search..."/>
            
            <div id="box" class="mt-3">
                {% for item in object_list %}
                        <br>{{ item }}<br><br/>
                {% endfor %}
            </div>
        </div>
    </div> 
</div>
{% endblock %}

{% block stylesheet %}
<style>
</style>
{% endblock %}

{% block scripts %}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script type="text/javascript">
    console.log('spinner js working')
    const data = "{{ qs_json }}";
    const rdata = JSON.parse(data.replace(/&quot;/g, '"'));

    const q = document.getElementById('search_here') 
    let filterArr = [];
    q.addEventListener('keyup', (e) => {
        box.innerHTML = ""
        filterArr = rdata.filter(info=> info['name'].includes(e.target.value))
        if(filterArr.length > 0) {
            filterArr.map(item=> {
                box.innerHTML += `<b>${item['name']}</b><br>`
            })
        } else {
            box.innerHTML = "<b>No results found...</b>"
        }
    })

</script>
{% endblock %}
