<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <title>Title</title>
  </head>
  <body>
    <div class="container">
        <div class="row">
            <div class="col">
                <div id="gjs">
                  <p>Testing editor using grapes js libs</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

    <!-- grapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/grapesjs/0.18.3/grapes.min.js" integrity="sha512-wxaizSOPknfIPZRsm61vBNRtaQoaTmqlFPkRhYCW3b4XcBNZ1j0z0fcvFRM8BjNjdnKVLnzK/ib7xDnfRh2r6g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/grapesjs/0.18.3/css/grapes.min.css" integrity="sha512-NDzKd6WMSccrZDcBHuGVyn60rhif0uhABUiWIqZ7wwQAFqiCqQUDG9xvgPr4XAUuhZBzHKky5TkMinZ8+gSJqw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script type="text/javascript">
        var editor = grapesjs.init({
            container: '#gjs',
            fromElement: true,
            width: "auto",
            storageManager: false,
        });
    </script>

  </body>
</html>
