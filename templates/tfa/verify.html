{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Verify Page{% endblock %}

{% block content %} 
<div class="container py-5">
    <div class="row">
        <div class="col-4">
            <form action="" method="POST" autocomplete="off">
                {% csrf_token %}
                {{ form|crispy}}
                <div class="form-group mt-2">
                    <button type="submit" class="btn btn-primary">Verify</button>
                </div>
            </form>
        </div>
    </div> 
</div>
{% endblock %}
